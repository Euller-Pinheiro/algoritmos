[project]
name = "algoritmos"
version = "0.1.0"
description = "Estruturas de dados e algoritmos clássicos implementados do zero em Python, com testes."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Euller Pinheiro" }]
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --doctest-modules"
testpaths = ["."]
python_files = ["test_*.py"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "N", "RUF", "PT"]

[tool.mypy]
python_version = "3.12"
strict = true
exclude = ["^\\.venv/"]

[[tool.mypy.overrides]]
module = ["*.tests.*"]
disallow_untyped_decorators = false
